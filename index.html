<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08101f" />
  <title>Koło losowania</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="pointer" aria-hidden="true"></div>

    <div class="wheel-wrap">
      <canvas id="wheel" width="1200" height="1200" aria-label="Koło losowania z dziesięcioma kwotami"></canvas>

      <button id="spinBtn" class="spin-center" type="button" aria-label="Zakręć kołem">
        SPIN
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
